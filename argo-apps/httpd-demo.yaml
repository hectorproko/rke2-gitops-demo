apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: httpd-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/<YOUR_USERNAME>/rke2-gitops-demo.git
    targetRevision: main
    path: apps/httpd-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: httpd-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true

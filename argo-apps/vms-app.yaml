apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: virtual-machines
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"   # After CDI is ready
spec:
  project: default
  source:
    repoURL: https://github.com/<your-github-username>/rke2-gitops-demo
    targetRevision: HEAD
    path: apps/virtualmachines
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
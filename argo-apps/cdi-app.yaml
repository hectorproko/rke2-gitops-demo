apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cdi
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"   # After kubevirt operator
spec:
  project: default
  source:
    repoURL: https://github.com/<your-github-username>/rke2-gitops-demo
    targetRevision: HEAD
    path: apps/cdi
  destination:
    server: https://kubernetes.default.svc
    namespace: cdi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true